spring:
  application:
    name: EnotesApplication
    port: 8080

  datasource:
    url: jdbc:mysql://localhost:3306/enotes
    dbcp2:
      driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
